version: '3.8'

services:
  morpheus-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - MORPHEUS_API_KEY=your_secure_api_key_here
      - MORPHEUS_AUDIT_DB=/app/data/audit.db
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
      
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
