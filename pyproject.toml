[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "morpheus"
version = "0.1.0"
description = "Enterprise-Grade Security Testing Tool for AI Agents and LLM Applications"
authors = ["Manu <manu@example.com>"]
readme = "README.md"
packages = [{include = "morpheus"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0.0"
fastapi = ">=0.100.0"
uvicorn = "^0.23.0"
click = "^8.1.0"
rich = "^13.0.0"
aiohttp = "^3.8.0"
jinja2 = "^3.1.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.7.0"
isort = "^5.12.0"
mypy = "^1.5.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
